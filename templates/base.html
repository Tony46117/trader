<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — Trading Signals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#2563eb',
                            'blue-light': '#3b82f6',
                            'blue-dark': '#1d4ed8',
                            green: '#10b981',
                            red: '#ef4444',
                            yellow: '#f59e0b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="font-sans antialiased min-h-screen" style="background: var(--bg-primary); color: var(--text-primary);">
    <!-- Sidebar -->
    <aside class="fixed left-0 top-0 h-full w-[220px] flex flex-col z-50" style="background: var(--bg-secondary); border-right: 1px solid var(--border-color);">
        <!-- Logo -->
        <div class="p-5" style="border-bottom: 1px solid var(--border-color);">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 flex items-center justify-center" style="background: var(--accent-blue);">
                    <span class="text-white font-bold text-sm">TS</span>
                </div>
                <div>
                    <h1 class="text-sm font-bold tracking-tight" style="color: var(--text-primary);">Trading Signals</h1>
                    <p class="text-[10px] font-medium" style="color: var(--text-muted);">Market Framework</p>
                </div>
            </div>
        </div>

        <!-- Nav -->
        <nav class="flex-1 p-3 space-y-0.5">
            <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                <span>Dashboard</span>
            </a>
            <a href="/signals" class="nav-link {% if active_page == 'signals' %}active{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
                <span>Signals</span>
                <span class="ml-auto text-[9px] px-1.5 py-0.5 font-semibold" style="background: rgba(16, 185, 129, 0.1); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.2);">LIVE</span>
            </a>
            <a href="/news" class="nav-link {% if active_page == 'news' %}active{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
                <span>News</span>
            </a>
            <a href="/analysis" class="nav-link {% if active_page == 'analysis' %}active{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                <span>Cross-Asset</span>
            </a>
        </nav>

        <!-- Footer -->
        <div class="p-4" style="border-top: 1px solid var(--border-color);">
            <div class="flex items-center gap-2 text-[10px]" style="color: var(--text-muted);">
                <div class="w-1.5 h-1.5" style="background: var(--accent-green);"></div>
                <span>System Online</span>
                <span class="ml-auto font-mono" id="clock"></span>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="ml-[220px] min-h-screen">
        <!-- Header -->
        <header class="sticky top-0 z-40" style="background: var(--bg-primary); border-bottom: 1px solid var(--border-color);">
            <div class="px-6 py-3 flex items-center justify-between">
                <h2 class="text-base font-bold" style="color: var(--text-primary);">{{ title }}</h2>
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2 text-xs" style="color: var(--text-muted);">
                        <span>Updated</span>
                        <span id="last-update" class="font-mono" style="color: var(--text-secondary);">—</span>
                    </div>
                    <button onclick="toggleTheme()" class="theme-toggle" title="Toggle theme">
                        <svg id="theme-icon-dark" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                        <svg id="theme-icon-light" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    </button>
                    <button onclick="refreshAll()" class="px-3 py-1.5 text-xs transition-all flex items-center gap-1.5" style="background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-secondary);">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        Refresh
                    </button>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <main class="p-6">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        function updateClock() {
            const el = document.getElementById('clock');
            if (el) el.textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Theme toggle
        function getTheme() {
            return localStorage.getItem('theme') || 'dark';
        }

        function applyTheme(theme) {
            const html = document.documentElement;
            const darkIcon = document.getElementById('theme-icon-dark');
            const lightIcon = document.getElementById('theme-icon-light');
            if (theme === 'light') {
                html.classList.add('light');
                html.classList.remove('dark');
                if (darkIcon) darkIcon.classList.add('hidden');
                if (lightIcon) lightIcon.classList.remove('hidden');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                if (darkIcon) darkIcon.classList.remove('hidden');
                if (lightIcon) lightIcon.classList.add('hidden');
            }
            localStorage.setItem('theme', theme);
        }

        function toggleTheme() {
            const current = getTheme();
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        // Apply saved theme on load
        applyTheme(getTheme());
    </script>
</body>
</html>
