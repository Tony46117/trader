<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — Trading Signals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            50: '#f0f0f5',
                            100: '#d1d1e0',
                            200: '#a3a3c2',
                            300: '#7575a3',
                            400: '#474785',
                            500: '#1a1a2e',
                            600: '#15152a',
                            700: '#101026',
                            800: '#0b0b1a',
                            900: '#06060f',
                            950: '#03030a',
                        },
                        signal: {
                            buy: '#22c55e',
                            'buy-bg': 'rgba(34, 197, 94, 0.12)',
                            sell: '#ef4444',
                            'sell-bg': 'rgba(239, 68, 68, 0.12)',
                            neutral: '#6b7280',
                            'neutral-bg': 'rgba(107, 114, 128, 0.12)',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'fade-in': 'fadeIn 0.4s ease-out',
                    },
                    keyframes: {
                        glow: {
                            '0%': { boxShadow: '0 0 5px rgba(34, 197, 94, 0.2)' },
                            '100%': { boxShadow: '0 0 20px rgba(34, 197, 94, 0.4)' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(4px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-dark-950 text-gray-100 font-sans antialiased min-h-screen">
    <!-- Sidebar -->
    <aside class="fixed left-0 top-0 h-full w-[220px] bg-dark-900/80 backdrop-blur-xl border-r border-white/[0.04] z-50 flex flex-col">
        <!-- Logo -->
        <div class="p-5 border-b border-white/[0.04]">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-green-500 to-emerald-600 flex items-center justify-center">
                    <span class="text-white font-bold text-sm">TS</span>
                </div>
                <div>
                    <h1 class="text-sm font-bold text-white tracking-tight">Trading Signals</h1>
                    <p class="text-[10px] text-gray-500 font-medium">Market Framework</p>
                </div>
            </div>
        </div>

        <!-- Nav -->
        <nav class="flex-1 p-3 space-y-0.5">
            <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                <span>Dashboard</span>
            </a>
            <a href="/signals" class="nav-link {% if active_page == 'signals' %}active{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
                <span>Signals</span>
                <span class="ml-auto text-[9px] bg-green-500/10 text-green-400 px-1.5 py-0.5 rounded-full font-semibold">LIVE</span>
            </a>
            <a href="/news" class="nav-link {% if active_page == 'news' %}active{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
                <span>News</span>
            </a>
            <a href="/analysis" class="nav-link {% if active_page == 'analysis' %}active{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                <span>Cross-Asset</span>
            </a>
            <a href="/trading-bot" class="nav-link {% if active_page == 'trading-bot' %}active{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>Trading Bot</span>
                <span class="ml-auto text-[9px] bg-blue-500/10 text-blue-400 px-1.5 py-0.5 rounded-full font-semibold">DEMO</span>
            </a>
        </nav>

        <!-- Footer -->
        <div class="p-4 border-t border-white/[0.04]">
            <div class="flex items-center gap-2 text-[10px] text-gray-600">
                <div class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div>
                <span>System Online</span>
                <span class="ml-auto font-mono" id="clock"></span>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="ml-[220px] min-h-screen">
        <!-- Header -->
        <header class="sticky top-0 z-40 bg-dark-950/70 backdrop-blur-xl border-b border-white/[0.04]">
            <div class="px-6 py-3 flex items-center justify-between">
                <h2 class="text-base font-bold text-white">{{ title }}</h2>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 text-xs text-gray-500">
                        <span>Updated</span>
                        <span id="last-update" class="font-mono text-gray-400">—</span>
                    </div>
                    <button onclick="refreshAll()" class="px-3 py-1.5 text-xs bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-gray-300 transition-all flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        Refresh
                    </button>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <main class="p-6">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        function updateClock() {
            const el = document.getElementById('clock');
            if (el) el.textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
        }
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
