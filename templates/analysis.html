{% extends "base.html" %}

{% block content %}
<div class="grid grid-cols-12 gap-5">
    <!-- Main Analysis -->
    <div class="col-span-12 lg:col-span-8 space-y-4">
        <!-- Regime Banner -->
        <div class="section-card" id="regime-banner">
            <div class="animate-pulse space-y-2">
                <div class="h-14 bg-white/5 rounded-xl"></div>
            </div>
        </div>

        <!-- DXY -->
        <div class="section-card">
            <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                US Dollar Index (DXY)
            </h3>
            <div id="dxy-analysis">
                <div class="animate-pulse"><div class="h-16 bg-white/5 rounded-xl"></div></div>
            </div>
        </div>

        <!-- VIX -->
        <div class="section-card">
            <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                <svg class="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                Volatility Index (VIX)
            </h3>
            <div id="vix-analysis">
                <div class="animate-pulse"><div class="h-16 bg-white/5 rounded-xl"></div></div>
            </div>
        </div>

        <!-- Yield Curve -->
        <div class="section-card">
            <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                <svg class="w-4 h-4 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
                US Yield Curve
            </h3>
            <div id="yield-analysis">
                <div class="animate-pulse"><div class="h-20 bg-white/5 rounded-xl"></div></div>
            </div>
        </div>

        <!-- Correlation Matrix -->
        <div class="section-card">
            <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"/></svg>
                Pair Correlation Matrix
            </h3>
            <div id="correlation-matrix">
                <div class="animate-pulse"><div class="h-24 bg-white/5 rounded-xl"></div></div>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="col-span-12 lg:col-span-4 space-y-4">
        <!-- Regime Signals -->
        <div class="section-card">
            <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                Regime Signals
            </h3>
            <div id="regime-signals">
                <div class="animate-pulse space-y-2">
                    <div class="h-10 bg-white/5 rounded-lg"></div>
                    <div class="h-10 bg-white/5 rounded-lg"></div>
                </div>
            </div>
        </div>

        <!-- Key Levels Reference -->
        <div class="section-card">
            <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                Key Levels
            </h3>
            <div class="space-y-2 text-xs">
                <div class="p-2.5 rounded-lg bg-white/[0.02]">
                    <div class="text-[9px] text-gray-500 mb-1 font-semibold uppercase tracking-wider">DXY Range</div>
                    <div class="flex justify-between text-gray-300">
                        <span>S: <span class="font-mono text-green-400">100.00</span></span>
                        <span>R: <span class="font-mono text-red-400">106.00</span></span>
                    </div>
                </div>
                <div class="p-2.5 rounded-lg bg-white/[0.02]">
                    <div class="text-[9px] text-gray-500 mb-1 font-semibold uppercase tracking-wider">VIX Thresholds</div>
                    <div class="flex justify-between text-gray-300">
                        <span class="text-green-400">&lt;12 Low</span>
                        <span class="text-yellow-400">12-20</span>
                        <span class="text-red-400">&gt;20 Fear</span>
                    </div>
                </div>
                <div class="p-2.5 rounded-lg bg-white/[0.02]">
                    <div class="text-[9px] text-gray-500 mb-1 font-semibold uppercase tracking-wider">Yield Curve</div>
                    <div class="flex justify-between text-gray-300">
                        <span class="text-green-400">Normal: 2Y &lt; 10Y</span>
                        <span class="text-red-400">Inverted</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bias Summary -->
        <div class="section-card">
            <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                Bias Summary
            </h3>
            <div id="bias-summary">
                <div class="animate-pulse"><div class="h-24 bg-white/5 rounded-xl"></div></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
