{% extends "base.html" %}

{% block content %}
<div class="grid grid-cols-12 gap-5">
    <!-- Signal Cards -->
    <div class="col-span-12 lg:col-span-8 space-y-4">
        <div class="section-card">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
                    Signal Analysis
                </h3>
                <div class="flex items-center gap-2">
                    <select id="pair-filter" class="text-xs bg-white/5 border border-white/10 rounded-lg px-3 py-1.5 text-gray-300 outline-none focus:border-green-500/50 transition-colors">
                        <option value="all">All Pairs</option>
                        {% for pair in pairs %}
                        <option value="{{ pair }}">{{ pair[:3] }}/{{ pair[3:] }}</option>
                        {% endfor %}
                    </select>
                    <button onclick="refreshSignals()" class="px-3 py-1.5 text-xs bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-gray-300 transition-all">
                        Refresh
                    </button>
                </div>
            </div>
            <div id="signal-detail-container">
                <div class="flex items-center justify-center py-16 text-gray-600">
                    <svg class="animate-spin h-5 w-5 mr-3 opacity-50" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                    <span class="text-xs">Analyzing markets...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="col-span-12 lg:col-span-4 space-y-4">
        <!-- Signal Summary -->
        <div class="section-card">
            <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                Summary
            </h3>
            <div class="space-y-2" id="signal-summary">
                <div class="animate-pulse space-y-2">
                    <div class="h-8 bg-white/5 rounded"></div>
                    <div class="h-8 bg-white/5 rounded"></div>
                </div>
            </div>
        </div>

        <!-- Indicator Legend -->
        <div class="section-card">
            <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                Indicators
            </h3>
            <div class="space-y-1.5 text-xs">
                <div class="flex items-center gap-2 p-2 rounded-lg bg-white/[0.02]">
                    <span class="w-2 h-2 rounded-full bg-green-400"></span>
                    <span class="text-gray-400">RSI Oversold</span>
                    <span class="ml-auto text-gray-600 font-mono text-[10px]">&lt; 30</span>
                </div>
                <div class="flex items-center gap-2 p-2 rounded-lg bg-white/[0.02]">
                    <span class="w-2 h-2 rounded-full bg-red-400"></span>
                    <span class="text-gray-400">RSI Overbought</span>
                    <span class="ml-auto text-gray-600 font-mono text-[10px]">&gt; 70</span>
                </div>
                <div class="flex items-center gap-2 p-2 rounded-lg bg-white/[0.02]">
                    <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                    <span class="text-gray-400">MACD Cross</span>
                    <span class="ml-auto text-gray-600 font-mono text-[10px]">12/26/9</span>
                </div>
                <div class="flex items-center gap-2 p-2 rounded-lg bg-white/[0.02]">
                    <span class="w-2 h-2 rounded-full bg-yellow-400"></span>
                    <span class="text-gray-400">BB Touch</span>
                    <span class="ml-auto text-gray-600 font-mono text-[10px]">20,2</span>
                </div>
                <div class="flex items-center gap-2 p-2 rounded-lg bg-white/[0.02]">
                    <span class="w-2 h-2 rounded-full bg-purple-400"></span>
                    <span class="text-gray-400">EMA Cross</span>
                    <span class="ml-auto text-gray-600 font-mono text-[10px]">9/21</span>
                </div>
                <div class="flex items-center gap-2 p-2 rounded-lg bg-white/[0.02]">
                    <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
                    <span class="text-gray-400">SMA Trend</span>
                    <span class="ml-auto text-gray-600 font-mono text-[10px]">20/50</span>
                </div>
            </div>
        </div>

        <!-- S/R Quick Reference -->
        <div class="section-card" id="sr-quick-ref">
            <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>
                S/R Levels
            </h3>
            <div class="text-xs text-gray-500 text-center py-4">
                Select a signal to view levels
            </div>
        </div>
    </div>
</div>
{% endblock %}
